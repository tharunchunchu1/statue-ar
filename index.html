<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Statue AR</title>
  <style>
    html {
      background: #000;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { background: transparent; }
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #hint.hidden { opacity: 0; }
    .link {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 10;
    }
    .link a {
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      text-decoration: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="hint">Point your camera at the statue</div>
  <div class="link"><a href="./calibrate.html">Open calibration</a></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { DEFAULT_OFFSETS, buildBeam, buildFlower } from './effects.js';

    const start = async () => {
      const mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: './targets/targets.mind',
        maxTrack: 1,
        uiLoading: 'yes',
        uiScanning: 'yes',
        uiError: 'yes',
        filterMinCF: 0.0001,
        filterBeta: 0.01,
      });

      const { renderer, scene, camera } = mindarThree;
      renderer.setClearColor(0x000000, 0);
      renderer.setClearAlpha(0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dl = new THREE.DirectionalLight(0xffffff, 0.7);
      dl.position.set(1, 2, 1);
      scene.add(dl);

      const anchor = mindarThree.addAnchor(0);

      const beam = buildBeam();
      beam.position.copy(DEFAULT_OFFSETS.beam.position);
      anchor.group.add(beam);

      const flower = buildFlower();
      flower.position.copy(DEFAULT_OFFSETS.flower.position);
      anchor.group.add(flower);

      const hint = document.getElementById('hint');
      anchor.onTargetFound = () => hint.classList.add('hidden');
      anchor.onTargetLost  = () => hint.classList.remove('hidden');

      await mindarThree.start();

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();
        beam.userData.tick?.(t);
        flower.userData.tick?.(t);
        renderer.render(scene, camera);
      });
    };

    start().catch((err) => {
      console.error(err);
      document.getElementById('hint').textContent =
        'Error: ' + (err?.message || 'could not start camera');
    });
  </script>
</body>
</html>
