<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Statue AR — Calibration</title>
  <style>
    html {
      background: #000;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { background: transparent; }
    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 12px;
      border-radius: 14px;
      font-size: 12px;
      z-index: 10;
      max-height: 55vh;
      overflow-y: auto;
    }
    #panel.collapsed .body { display: none; }
    #panel header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }
    #panel button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 4px;
    }
    #panel button.secondary {
      background: #555;
    }
    .section {
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding-top: 8px;
      margin-top: 8px;
    }
    .section h3 {
      margin: 0 0 6px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .row label {
      width: 18px;
      font-weight: 600;
    }
    .row input[type="range"] {
      flex: 1;
    }
    .row .val {
      width: 54px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.9;
    }
    #output {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      white-space: pre;
      margin-top: 8px;
      user-select: all;
    }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="panel">
    <header>
      <span>Calibration</span>
      <span>
        <button id="copyBtn" class="secondary">Copy values</button>
        <button id="toggleBtn">Hide</button>
      </span>
    </header>
    <div class="body">
      <div class="section" data-effect="beam">
        <h3>Beam (fist)</h3>
      </div>
      <div class="section" data-effect="flower">
        <h3>Flower (shoe)</h3>
      </div>
      <pre id="output"></pre>
    </div>
  </div>
  <div id="hint">Point camera at the statue</div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { DEFAULT_OFFSETS, buildBeam, buildFlower } from './effects.js';

    const effects = [
      { id: 'beam',   build: buildBeam,   range: { x: [-2, 2], y: [-2, 3], z: [-1, 1] } },
      { id: 'flower', build: buildFlower, range: { x: [-2, 2], y: [-2, 2], z: [-1, 1] } },
    ];

    const params = new URLSearchParams(location.search);
    const state = {};
    for (const e of effects) {
      const d = DEFAULT_OFFSETS[e.id].position;
      state[e.id] = {
        x: parseFloat(params.get(`${e.id}x`) ?? d.x),
        y: parseFloat(params.get(`${e.id}y`) ?? d.y),
        z: parseFloat(params.get(`${e.id}z`) ?? d.z),
      };
    }

    const objects = {};

    const start = async () => {
      const mindarThree = new MindARThree({
        container: document.body,
        imageTargetSrc: './targets/targets.mind',
        maxTrack: 1,
        uiLoading: 'yes',
        uiScanning: 'yes',
        filterMinCF: 0.0001,
        filterBeta: 0.01,
      });

      const { renderer, scene, camera } = mindarThree;
      renderer.setClearColor(0x000000, 0);
      renderer.setClearAlpha(0);
      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dl = new THREE.DirectionalLight(0xffffff, 0.7);
      dl.position.set(1, 2, 1);
      scene.add(dl);

      const anchor = mindarThree.addAnchor(0);

      for (const e of effects) {
        const obj = e.build();
        obj.position.set(state[e.id].x, state[e.id].y, state[e.id].z);
        anchor.group.add(obj);
        objects[e.id] = obj;
      }

      const hint = document.getElementById('hint');
      anchor.onTargetFound = () => hint.style.opacity = '0';
      anchor.onTargetLost  = () => hint.style.opacity = '1';

      await mindarThree.start();

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();
        for (const id in objects) objects[id].userData.tick?.(t);
        renderer.render(scene, camera);
      });
    };

    const buildUI = () => {
      const output = document.getElementById('output');

      const update = () => {
        for (const e of effects) {
          const o = objects[e.id];
          if (!o) continue;
          o.position.set(state[e.id].x, state[e.id].y, state[e.id].z);
        }
        output.textContent =
`beam:   (${state.beam.x.toFixed(3)}, ${state.beam.y.toFixed(3)}, ${state.beam.z.toFixed(3)})
flower: (${state.flower.x.toFixed(3)}, ${state.flower.y.toFixed(3)}, ${state.flower.z.toFixed(3)})`;
      };

      for (const e of effects) {
        const section = document.querySelector(`.section[data-effect="${e.id}"]`);
        for (const axis of ['x', 'y', 'z']) {
          const row = document.createElement('div');
          row.className = 'row';
          const [lo, hi] = e.range[axis];
          row.innerHTML = `
            <label>${axis.toUpperCase()}</label>
            <input type="range" min="${lo}" max="${hi}" step="0.005" value="${state[e.id][axis]}" />
            <span class="val">${state[e.id][axis].toFixed(3)}</span>
          `;
          const input = row.querySelector('input');
          const val = row.querySelector('.val');
          input.addEventListener('input', () => {
            const v = parseFloat(input.value);
            state[e.id][axis] = v;
            val.textContent = v.toFixed(3);
            update();
          });
          section.appendChild(row);
        }
      }

      document.getElementById('toggleBtn').addEventListener('click', (ev) => {
        const panel = document.getElementById('panel');
        panel.classList.toggle('collapsed');
        ev.target.textContent = panel.classList.contains('collapsed') ? 'Show' : 'Hide';
      });

      document.getElementById('copyBtn').addEventListener('click', () => {
        const text = output.textContent;
        navigator.clipboard?.writeText(text);
        const btn = document.getElementById('copyBtn');
        const old = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => (btn.textContent = old), 1200);
      });

      update();
    };

    buildUI();
    start().catch((err) => {
      console.error(err);
      document.getElementById('hint').textContent =
        'Error: ' + (err?.message || 'could not start camera');
    });
  </script>
</body>
</html>
